<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:;" />
  <title>EQL Timers</title>
  <link rel="stylesheet" href="panel.css" />
</head>
<body data-locked="true">
  <!-- The window is an invisible, generously-sized box; only this panel paints, and only
       while something is counting. It is TOP-anchored so a slot arriving grows the panel
       downward and never moves the rows already on screen.

       Which panel this window is comes from `?panel=<id>` on the file URL — see
       panel.js. The title is the player's, read from config and re-read on every config
       push, so renaming a panel does not cost it its position. -->
  <div id="panel" hidden>
    <div class="phead">
      <span class="title" id="title"></span>
      <span class="who" id="who"></span>
    </div>
    <div id="slots"></div>
  </div>

  <!-- Only visible while unlocked. The panel vanishes when nothing is counting, by
       design, and a window with nothing in it cannot be dragged anywhere. -->
  <div id="placeholder">
    <span class="verb" id="placeholder-title"></span>
    <span class="hint">drag to place — your timers appear here</span>
  </div>

  <script type="module" src="panel.js"></script>
</body>
</html>
