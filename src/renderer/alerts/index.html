<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:;" />
  <title>EQL Cast Warnings</title>
  <link rel="stylesheet" href="alerts.css" />
</head>
<body data-locked="true">
  <!-- The whole window is an invisible box; only the chips paint. The stack grows
       downward from the top edge so the anchor the player placed never moves. -->
  <ol id="stack"></ol>

  <!-- Crowd control sitting ON the group right now: STUNNED/MEZZED/CHARMED chips.
       Below the warnings (the call to act outranks the status report), above the
       timers (a stated fact outranks an estimate). -->
  <ol id="effects"></ol>

  <!-- Learned boss timers, always BELOW the live warnings: a warning is a fact, a
       timer is an estimate, and the estimate must never displace the fact. -->
  <ol id="timers"></ol>

  <!-- Acknowledgements for the in-game "pet <Name> = <Owner>" command. Bottom of the
       stack: the player asked for these, so they never need to outrank a warning —
       but they do need to be SEEN, because the alternative to a visible reply is a
       command that silently does nothing. -->
  <ol id="notices"></ol>

  <!-- Only visible while unlocked: an empty invisible window cannot be dragged. -->
  <div id="placeholder">
    <span class="verb">Cast warnings</span>
    <span class="hint">drag to place — warnings appear here</span>
  </div>

  <script type="module" src="alerts.js"></script>
</body>
</html>
